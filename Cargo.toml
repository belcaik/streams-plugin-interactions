[package]
name = "streams-plugin-interactions"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[[bin]]
name = "interactions"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[workspace]
